name: Ошибка Egoist Shield
description: Сообщить о воспроизводимой проблеме без персональных данных
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте VPN links, токены, HWID или необработанные diagnostics."
  - type: input
    id: version
    attributes:
      label: Версия Egoist Shield
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition и build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Я удалил токены, ссылки подписок, IP и другие персональные данные.
          required: true

